[project]
name = "commitscope-backend"
version = "0.1.0"
description = "CommitScope backend — Git repository intelligence platform"
requires-python = ">=3.12"

dependencies = [
    # Web framework
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",

    # Database — SQLAlchemy 2.x async stack
    "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
    "alembic>=1.13.0,<2.0.0",
    "asyncpg>=0.29.0,<1.0.0",          # async PostgreSQL driver

    # Configuration
    "pydantic-settings>=2.6.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",

    # Git integration (replaces GitPython — see architecture decision A)
    # Pygit2 wraps libgit2, actively maintained, MIT + libgit2 exception.
    # Unused in Stage 1; installed now so the image is ready for Stage 2.
    "pygit2>=1.16.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",          # async ASGI test client
    "aiosqlite>=0.20.0",      # in-memory SQLite for unit tests (no Postgres needed)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]

# ── ruff (linting / formatting) ───────────────────────────────────────────────
[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
